<style>
* {
  box-sizing: border-box;
}

html,
body {

  background: #0b0d12;

  font-family: Inter, system-ui, sans-serif;

}

.bg {

  background-position: center;
  transition: background-image 0.6s;
}

.overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.12),
    rgba(0, 0, 0, 0.68)

}

.wrap {

  height: 100%;
  padding: 4vh 4vw;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 3vh;
}

.clock {
  font-family: "DM Sans", sans-serif;
  font-size: 7.8vw;

  line-height: 1.05;
  text-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
}

.date {

  color: rgba(255, 255, 255, 0.82);
}

.panel {
  padding: 3vh 3vw;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

  font-size: 1.4vw;

}

.task-title {

  margin: 0 0 1vh 0;
}

.range {
  margin: 0 0 2vh 0;
  font-size: 2vw;
  color: rgba(255, 255, 255, 0.85);
}

.progress {
  display: flex;
  align-items: center;
  gap: 1vw;
  flex-wrap: wrap;
  margin-bottom: 2vh;
}

.bar {
  height: 12px;
  width: min(60vw, 520px);
  background: rgba(255, 255, 255, 0.24);
  border-radius: 999px;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.9),
    rgba(255, 255, 255, 0.6)

}

.left {

.next {

  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.24);
  backdrop-filter: blur(6px);
}
</style>

const $ = id => document.getElementById(id);


function minutesFromTime(time) {
  const [hours, minutes] = time.split(":").map(Number);
  return hours * 60 + minutes;
}


function twelveHourTime(totalMinutes) {
  totalMinutes =
    (totalMinutes % 1440 + 1440) % 1440;

  let hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;

  const period = hours >= 12 ? "PM" : "AM";

  hours = hours % 12 || 12;

  return (
    hours +
    ":" +
    String(minutes).padStart(2, "0") +
    " " +
    period
  );
}


function formatRange(start, end) {
  return (
    twelveHourTime(start) +
    " – " +
    twelveHourTime(end)
  );
}


function previousDayIndex(dayIndex) {
  return (dayIndex + 6) % 7;
}


function nextDayIndex(dayIndex) {
  return (dayIndex + 1) % 7;
}


/*
If the current time is earlier than today's wake time,
TimeDash treats it as the previous day's sleep period.
*/

function getScheduleContext(date) {
  const actualDayIndex = date.getDay();
  const actualDayName = DAYS[actualDayIndex];

  const todaySchedule = SCHEDULES[actualDayName];

  const firstTaskStart =
    minutesFromTime(todaySchedule[0].start);

  const now =
    date.getHours() * 60 + date.getMinutes();

  if (now < firstTaskStart) {
    const anchorDayIndex =
      previousDayIndex(actualDayIndex);

    const anchorDayName =
      DAYS[anchorDayIndex];

    return {
      actualDayIndex,
      actualDayName,
      anchorDayIndex,
      anchorDayName,
      schedule: SCHEDULES[anchorDayName]
    };
  }

  return {
    actualDayIndex,
    actualDayName,
    anchorDayIndex: actualDayIndex,
    anchorDayName: actualDayName,
    schedule: todaySchedule
  };
}


function findCurrentTask(schedule, now) {
  for (let index = 0; index < schedule.length; index++) {
    const task = schedule[index];

    const start =
      minutesFromTime(task.start);

    const end =
      minutesFromTime(task.end);

    const crossesMidnight = end < start;

    const active =
      (!crossesMidnight &&
        now >= start &&
        now < end) ||
      (crossesMidnight &&
        (now >= start || now < end));

    if (active) {
      return {
        task,
        index,
        start,
        end
      };
    }
  }

  return null;
}


function getNextTask(context, currentIndex) {
  const currentSchedule = context.schedule;

  if (currentIndex < currentSchedule.length - 1) {
    return {
      task: currentSchedule[currentIndex + 1],
      dayName: context.anchorDayName
    };
  }

  const nextIndex =
    nextDayIndex(context.anchorDayIndex);

  const nextDayName =
    DAYS[nextIndex];

  return {
    task: SCHEDULES[nextDayName][0],
    dayName: nextDayName
  };
}


function calculateTimeValues(start, end, now) {
  const total =
    end >= start
      ? end - start
      : 1440 - start + end;

  let elapsed;

  if (end >= start) {
    elapsed = now - start;
  } else if (now >= start) {
    elapsed = now - start;
  } else {
    elapsed = 1440 - start + now;
  }

  elapsed = Math.max(0, Math.min(total, elapsed));

  const remaining = total - elapsed;
  const percentage =
    total === 0 ? 100 : (elapsed / total) * 100;

  return {
    total,
    elapsed,
    remaining,
    percentage
  };
}


function formatRemaining(minutes) {
  if (minutes < 60) {
    return minutes + " min left";
  }

  const hours = Math.floor(minutes / 60);
  const extraMinutes = minutes % 60;

  if (extraMinutes === 0) {
    return hours + (hours === 1 ? " hr left" : " hrs left");
  }

  return hours + " hr " + extraMinutes + " min left";
}


function tick() {
  const date = new Date();

  const now =
    date.getHours() * 60 +
    date.getMinutes();

  $("clock").textContent =
    twelveHourTime(now);

  $("date").textContent =
    date.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    });

  $("tz").textContent =
    Intl.DateTimeFormat()
      .resolvedOptions()
      .timeZone;

  const context =
    getScheduleContext(date);

  const current =
    findCurrentTask(
      context.schedule,
      now
    );

  if (!current) {
    $("task").textContent =
      "Schedule unavailable";

    $("range").textContent = "";
    $("left").textContent = "";
    $("bar").style.width = "0%";
    return;
  }

  $("dayLabel").textContent =
    context.actualDayName;

  $("scheduleDay").textContent =
    context.actualDayName + " schedule";

  $("task").textContent =
    current.task.name;

  $("range").textContent =
    formatRange(
      current.start,
      current.end
    );

  const timeValues =
    calculateTimeValues(
      current.start,
      current.end,
      now
    );

  $("bar").style.width =
    timeValues.percentage + "%";

  $("left").textContent =
    formatRemaining(
      timeValues.remaining
    );

  const next =
    getNextTask(
      context,
      current.index
    );

  $("nextTask").textContent =
    next.task.name;

  $("nextRange").textContent =
    formatRange(
      minutesFromTime(next.task.start),
      minutesFromTime(next.task.end)
    );

  const background =
    BGS[current.task.cat] ||
    BGS.Morning;

  $("bg").style.backgroundImage =
    `url("${background}")`;
}


tick();

setInterval(tick, 1000);
